[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackwise"
version = "0.1.0"
description = "AWS infrastructure scanner with local AI-powered recommendations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StackWise contributors" }]

dependencies = [
    "boto3>=1.34",
    "typer[all]>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "matplotlib>=3.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[ec2,lambda,iam,rds,s3,sts]>=5.0",
    "ruff>=0.5",
]

[project.scripts]
stackwise = "stackwise.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stackwise"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
