# StackWise data rules
# S3, RDS, DynamoDB, EFS, ElastiCache

# S3
- id: DAT-001
  title: "S3 bucket has versioning disabled"
  severity: MEDIUM
  resource_type: bucket
  service: s3
  condition: |
    not resource.get('VersioningCheckFailed') and (resource.get('Versioning') or {}).get('Status') != 'Enabled'
  remediation: >
    Enable versioning to protect against accidental deletion and enable point-in-time recovery.

- id: DAT-002
  title: "S3 bucket encryption configuration sets no SSE-S3 or SSE-KMS algorithm"
  severity: HIGH
  resource_type: bucket
  service: s3
  # Since January 2023, S3 encrypts new objects with SSE-S3 even when the bucket has no
  # explicit configuration, so only an explicit rule without a supported algorithm fires.
  condition: |
    not resource.get('EncryptionCheckFailed') and bool((resource.get('ServerSideEncryptionConfiguration') or {}).get('Rules')) and not any(((r or {}).get('ApplyServerSideEncryptionByDefault') or {}).get('SSEAlgorithm') in ('AES256', 'aws:kms', 'aws:kms:dsse') for r in (resource.get('ServerSideEncryptionConfiguration') or {}).get('Rules'))
  remediation: >
    Set the bucket's default encryption rule to SSE-S3 (AES256) or SSE-KMS.

- id: DAT-003
  title: "S3 bucket has public access block disabled"
  severity: HIGH
  resource_type: bucket
  service: s3
  condition: |
    not resource.get('PublicAccessBlockCheckFailed') and not (resource.get('PublicAccessBlock') or {}).get('BlockPublicAcls')
  remediation: >
    Enable Block Public Access to prevent accidental public exposure.

- id: DAT-004
  title: "S3 bucket has no lifecycle policy"
  severity: LOW
  resource_type: bucket
  service: s3
  condition: |
    not resource.get('LifecycleCheckFailed') and (not resource.get('LifecycleRules') or len((resource.get('LifecycleRules') or [])) == 0)
  remediation: >
    Add lifecycle rules to transition or expire objects and reduce storage costs.

- id: DAT-019
  title: "S3 bucket security configuration could not be verified"
  severity: INFO
  resource_type: bucket
  service: s3
  condition: |
    resource.get('VersioningCheckFailed') or resource.get('EncryptionCheckFailed') or resource.get('PublicAccessBlockCheckFailed') or resource.get('LifecycleCheckFailed')
  remediation: >
    A versioning/encryption/public-access-block/lifecycle check failed (permissions
    or API error) — verify manually rather than trusting the other DAT rules for
    this bucket.

# RDS
- id: DAT-005
  title: "RDS instance is single-AZ"
  severity: MEDIUM
  resource_type: db_instance
  service: rds
  # Aurora members are covered by the cluster rule (DAT-009), and a read replica's
  # availability comes from its source, so neither is a single-AZ instance.
  condition: |
    resource.get('MultiAZ') is not True and not resource.get('DBClusterIdentifier') and not resource.get('ReadReplicaSourceDBInstanceIdentifier')
  remediation: >
    Enable Multi-AZ for production databases to improve availability.

- id: DAT-006
  title: "RDS instance has encryption disabled"
  severity: HIGH
  resource_type: db_instance
  service: rds
  condition: |
    resource.get('StorageEncrypted') is not True
  remediation: >
    Enable encryption at rest for RDS storage.

- id: DAT-007
  title: "RDS instance is publicly accessible"
  severity: HIGH
  resource_type: db_instance
  service: rds
  condition: |
    resource.get('PubliclyAccessible') is True
  remediation: >
    Disable public accessibility; access via VPC or VPN.

- id: DAT-008
  title: "RDS instance uses deprecated engine version"
  severity: MEDIUM
  resource_type: db_instance
  service: rds
  condition: |
    (resource.get('Engine') or '').startswith('mysql') and ((resource.get('EngineVersion') or '') or '').startswith('5.')
  remediation: >
    Upgrade to a supported engine version for security patches.

- id: DAT-009
  title: "RDS cluster is single-AZ"
  severity: MEDIUM
  resource_type: db_cluster
  service: rds
  condition: |
    resource.get('MultiAZ') is not True
  remediation: >
    Enable Multi-AZ for Aurora clusters for high availability.

- id: DAT-010
  title: "RDS cluster has encryption disabled"
  severity: HIGH
  resource_type: db_cluster
  service: rds
  condition: |
    resource.get('StorageEncrypted') is not True
  remediation: >
    Enable encryption at rest for Aurora storage.

# DynamoDB
- id: DAT-011
  title: "DynamoDB table has point-in-time recovery disabled"
  severity: MEDIUM
  resource_type: table
  service: dynamodb
  condition: |
    not resource.get('DescribeTableCheckFailed') and not resource.get('PointInTimeRecoveryCheckFailed') and (resource.get('PointInTimeRecoveryDescription') or {}).get('PointInTimeRecoveryStatus') != 'ENABLED'
  remediation: >
    Enable point-in-time recovery for backup and restore capability.

- id: DAT-012
  title: "DynamoDB table server-side encryption is not enabled"
  severity: HIGH
  resource_type: table
  service: dynamodb
  # No SSEDescription means the AWS-owned key, which is still encryption at rest. Only a
  # reported status other than ENABLED is a problem.
  condition: |
    not resource.get('DescribeTableCheckFailed') and (resource.get('SSEDescription') or {}).get('Status') not in (None, 'ENABLED')
  remediation: >
    Enable encryption at rest for DynamoDB tables.

- id: DAT-013
  title: "DynamoDB table uses provisioned capacity — review utilization"
  severity: INFO
  resource_type: table
  service: dynamodb
  # No consumed-capacity metric is collected (would need cloudwatch:GetMetricData,
  # which isn't in the documented least-privilege IAM policy), so this can only
  # flag PROVISIONED tables for manual review, not actually detect low utilization.
  condition: |
    not resource.get('DescribeTableCheckFailed') and (resource.get('BillingModeSummary') or {}).get('BillingMode') == 'PROVISIONED'
  remediation: >
    Check CloudWatch ConsumedReadCapacityUnits/ConsumedWriteCapacityUnits against
    provisioned throughput; consider on-demand mode if utilization is consistently low.

# EFS
- id: DAT-014
  title: "EFS file system has encryption disabled"
  severity: HIGH
  resource_type: file_system
  service: efs
  condition: |
    resource.get('Encrypted') is not True
  remediation: >
    Enable encryption at rest for EFS file systems.

- id: DAT-015
  title: "EFS file system has no lifecycle policy"
  severity: LOW
  resource_type: file_system
  service: efs
  condition: |
    not resource.get('LifecycleCheckFailed') and (not resource.get('LifecyclePolicies') or len((resource.get('LifecyclePolicies') or [])) == 0)
  remediation: >
    Consider lifecycle policies to transition infrequently accessed files to Infrequent Access.

# ElastiCache
- id: DAT-016
  title: "ElastiCache cluster is single-node (no replication)"
  severity: MEDIUM
  resource_type: cache_cluster
  service: elasticache
  # Memcached has no replication groups, so only Redis and Valkey can be missing one.
  condition: |
    resource.get('Engine') in ('redis', 'valkey') and not resource.get('ReplicationGroupId')
  remediation: >
    Use replication groups for high availability and failover.

- id: DAT-017
  title: "ElastiCache cluster has encryption disabled"
  severity: HIGH
  resource_type: cache_cluster
  service: elasticache
  # Memcached doesn't report AtRestEncryptionEnabled at all.
  condition: |
    resource.get('Engine') in ('redis', 'valkey') and resource.get('AtRestEncryptionEnabled') is not True
  remediation: >
    Enable encryption at rest for ElastiCache.

- id: DAT-018
  title: "ElastiCache replication group has encryption disabled"
  severity: HIGH
  resource_type: replication_group
  service: elasticache
  condition: |
    resource.get('AtRestEncryptionEnabled') is not True
  remediation: >
    Enable encryption at rest for ElastiCache replication groups.

# Checks that could not run
- id: DAT-020
  title: "DynamoDB table configuration could not be verified"
  severity: INFO
  resource_type: table
  service: dynamodb
  condition: |
    resource.get('DescribeTableCheckFailed') or resource.get('PointInTimeRecoveryCheckFailed')
  remediation: >
    A describe_table or describe_continuous_backups check failed (permissions or API
    error), so DAT-011, DAT-012 or DAT-013 was skipped for this table. Verify manually.

- id: DAT-021
  title: "EFS lifecycle configuration could not be verified"
  severity: INFO
  resource_type: file_system
  service: efs
  condition: |
    resource.get('LifecycleCheckFailed')
  remediation: >
    The lifecycle check failed (permissions or API error), so DAT-015 was skipped for
    this file system. Verify manually, and check for
    elasticfilesystem:DescribeLifecycleConfiguration.

- id: DAT-022
  title: "ElastiCache replication group has a single node"
  severity: MEDIUM
  resource_type: replication_group
  service: elasticache
  condition: |
    resource.get('MemberClusterCount') == 1
  remediation: >
    Add a replica to the replication group so it can fail over.
