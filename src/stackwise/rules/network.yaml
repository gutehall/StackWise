# StackWise network rules
# VPC, Security Groups, ELB, NAT Gateway, API Gateway

# VPC
- id: NET-001
  title: "VPC is the default VPC"
  severity: LOW
  resource_type: vpc
  service: ec2
  condition: |
    resource.get('IsDefault') is True
  remediation: >
    Avoid using the default VPC for production; create dedicated VPCs.

- id: NET-002
  title: "VPC has no flow logs"
  severity: MEDIUM
  resource_type: vpc
  service: ec2
  condition: |
    not resource.get('FlowLogsCheckFailed') and not resource.get('FlowLogsEnabled') and not resource.get('FlowLogs')
  remediation: >
    Enable VPC Flow Logs for network traffic monitoring and troubleshooting.

# Security Groups
- id: NET-003
  title: "Security group allows the internet on SSH (port 22)"
  severity: HIGH
  resource_type: security_group
  service: ec2
  # Any rule whose port range contains 22, or that allows all protocols, from
  # 0.0.0.0/0 or ::/0.
  condition: |
    any(
      (perm.get('IpProtocol') == '-1' or (perm.get('IpProtocol') in ('tcp', '6') and (perm.get('FromPort') or 0) <= 22 <= (perm.get('ToPort') or 0))) and
      (any((r or {}).get('CidrIp') == '0.0.0.0/0' for r in (perm.get('IpRanges') or [])) or any((r or {}).get('CidrIpv6') == '::/0' for r in (perm.get('Ipv6Ranges') or [])))
      for perm in (resource.get('IpPermissions') or [])
    )
  remediation: >
    Restrict SSH access to specific IP ranges or use SSM Session Manager.

- id: NET-004
  title: "Security group allows the internet on RDP (port 3389)"
  severity: HIGH
  resource_type: security_group
  service: ec2
  # Any rule whose port range contains 3389, or that allows all protocols, from
  # 0.0.0.0/0 or ::/0.
  condition: |
    any(
      (perm.get('IpProtocol') == '-1' or (perm.get('IpProtocol') in ('tcp', '6') and (perm.get('FromPort') or 0) <= 3389 <= (perm.get('ToPort') or 0))) and
      (any((r or {}).get('CidrIp') == '0.0.0.0/0' for r in (perm.get('IpRanges') or [])) or any((r or {}).get('CidrIpv6') == '::/0' for r in (perm.get('Ipv6Ranges') or [])))
      for perm in (resource.get('IpPermissions') or [])
    )
  remediation: >
    Restrict RDP access to specific IP ranges or use a bastion host.

- id: NET-005
  title: "Security group allows unrestricted ingress (0.0.0.0/0 or ::/0)"
  severity: MEDIUM
  resource_type: security_group
  service: ec2
  # A rule that also opens SSH or RDP is reported once, by the HIGH rule (NET-003/004).
  condition: |
    any(
      (any((r or {}).get('CidrIp') == '0.0.0.0/0' for r in (perm.get('IpRanges') or [])) or any((r or {}).get('CidrIpv6') == '::/0' for r in (perm.get('Ipv6Ranges') or []))) and
      not (perm.get('IpProtocol') == '-1' or (perm.get('IpProtocol') in ('tcp', '6') and (perm.get('FromPort') or 0) <= 22 <= (perm.get('ToPort') or 0))) and
      not (perm.get('IpProtocol') == '-1' or (perm.get('IpProtocol') in ('tcp', '6') and (perm.get('FromPort') or 0) <= 3389 <= (perm.get('ToPort') or 0)))
      for perm in (resource.get('IpPermissions') or [])
    )
  remediation: >
    Restrict ingress to minimum required CIDR blocks.

# ELB
- id: NET-006
  title: "Load balancer has access logging disabled"
  severity: LOW
  resource_type: load_balancer
  service: elbv2
  condition: |
    not resource.get('AttributesCheckFailed') and not any(a.get('Key') == 'access_logs.s3.enabled' and a.get('Value') == 'true' for a in (resource.get('Attributes') or []))
  remediation: >
    Enable access logs for audit and troubleshooting.

- id: NET-007
  title: "Application load balancer serves HTTP"
  severity: MEDIUM
  resource_type: load_balancer
  service: elbv2
  # Any HTTP listener counts, even next to an HTTPS one, unless it only redirects to
  # HTTPS. Network load balancers use TCP/UDP/TLS and aren't in scope.
  condition: |
    not resource.get('ListenersCheckFailed') and resource.get('Type') == 'application' and any(
      (l or {}).get('Protocol') == 'HTTP' and not (l or {}).get('RedirectsToHttps')
      for l in (resource.get('Listeners') or [])
    )
  remediation: >
    Use HTTPS listeners with ACM certificates for encrypted traffic.

- id: NET-008
  title: "Load balancer has no deletion protection"
  severity: LOW
  resource_type: load_balancer
  service: elbv2
  condition: |
    not resource.get('AttributesCheckFailed') and not any(a.get('Key') == 'deletion_protection.enabled' and a.get('Value') == 'true' for a in (resource.get('Attributes') or []))
  remediation: >
    Enable deletion protection for production load balancers.

# NAT Gateway
- id: NET-009
  title: "NAT Gateway is in use (consider cost optimization)"
  severity: INFO
  resource_type: nat_gateway
  service: ec2
  condition: |
    resource.get('State') == 'available'
  remediation: >
    Consider VPC Lattice or PrivateLink for private connectivity to reduce NAT costs.

# API Gateway
- id: NET-010
  title: "API Gateway REST API has no throttling configured"
  severity: LOW
  resource_type: rest_api
  service: apigateway
  condition: |
    not resource.get('ThrottleCheckFailed') and (resource.get('Throttle') or {}).get('rateLimit') is None and (resource.get('Throttle') or {}).get('burstLimit') is None
  remediation: >
    Configure throttling to protect against abuse and control costs.

# Checks that could not run
- id: NET-012
  title: "VPC flow log configuration could not be verified"
  severity: INFO
  resource_type: vpc
  service: ec2
  condition: |
    resource.get('FlowLogsCheckFailed')
  remediation: >
    The flow log check failed (permissions or API error), so NET-002 was skipped
    for this VPC. Verify manually, and check for ec2:DescribeFlowLogs.

- id: NET-013
  title: "Load balancer configuration could not be verified"
  severity: INFO
  resource_type: load_balancer
  service: elbv2
  condition: |
    resource.get('AttributesCheckFailed') or resource.get('ListenersCheckFailed')
  remediation: >
    An attribute or listener check failed (permissions or API error), so NET-006,
    NET-007 or NET-008 was skipped for this load balancer. Verify manually.

- id: NET-014
  title: "API Gateway throttling could not be verified"
  severity: INFO
  resource_type: rest_api
  service: apigateway
  condition: |
    resource.get('ThrottleCheckFailed')
  remediation: >
    The stage lookup failed (permissions or API error), so NET-010 was skipped for
    this API. Verify manually.
