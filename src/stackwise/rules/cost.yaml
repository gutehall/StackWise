# StackWise cost rules
# Cost Explorer, Compute Optimizer, Tagging

- id: CST-001
  title: "Resource has no cost allocation tags"
  severity: LOW
  resource_type: tagged_resource
  service: resourcegroupstaggingapi
  condition: |
    not resource.get('Tags') or len((resource.get('Tags') or [])) == 0
  remediation: >
    Add cost allocation tags (e.g. Environment, Project) for cost tracking.

- id: CST-002
  title: "Compute Optimizer recommends rightsizing"
  severity: INFO
  resource_type: ec2_recommendation
  service: compute-optimizer
  condition: |
    resource.get('finding') in ('Overprovisioned', 'Underprovisioned', 'NotOptimized')
  remediation: >
    Review Compute Optimizer recommendations for EC2 rightsizing.

- id: CST-003
  title: "Lambda has Compute Optimizer recommendation"
  severity: INFO
  resource_type: lambda_recommendation
  service: compute-optimizer
  condition: |
    resource.get('finding') == 'NotOptimized'
  remediation: >
    Review Compute Optimizer recommendations for Lambda memory optimization.

- id: CST-004
  title: "Compute Optimizer is not enabled"
  severity: INFO
  resource_type: status
  service: compute-optimizer
  condition: |
    resource.get('OptInRequired') is True
  remediation: >
    Opt in to AWS Compute Optimizer to get EC2 and Lambda rightsizing recommendations.
    Until then, CST-002 and CST-003 can't report anything.

- id: CST-005
  title: "Some Compute Optimizer recommendations could not be retrieved"
  severity: INFO
  resource_type: status
  service: compute-optimizer
  condition: |
    bool(resource.get('RecommendationErrors'))
  remediation: >
    Compute Optimizer returned errors alongside its recommendations, so CST-002 may
    be missing instances. See RecommendationErrors on this resource.
