# StackWise discovery rules
# Config, Resource Groups Tagging

- id: DSC-001
  title: "AWS Config recorder is not recording"
  severity: MEDIUM
  resource_type: recorder
  service: config
  condition: |
    not resource.get('RecordingCheckFailed') and resource.get('recording') is not True
  remediation: >
    Enable AWS Config recording for compliance and drift detection.

- id: DSC-002
  title: "Resource is untagged"
  severity: LOW
  resource_type: tagged_resource
  service: resourcegroupstaggingapi
  condition: |
    not resource.get('Tags') or len((resource.get('Tags') or [])) == 0
  remediation: >
    Add tags for resource discovery and cost allocation.

# Checks that could not run
- id: DSC-003
  title: "AWS Config recorder status could not be verified"
  severity: INFO
  resource_type: recorder
  service: config
  condition: |
    resource.get('RecordingCheckFailed')
  remediation: >
    The recorder status check failed (permissions or API error), so DSC-001 was skipped
    for this recorder. Verify manually, and check for
    config:DescribeConfigurationRecorderStatus.
