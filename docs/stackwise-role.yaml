AWSTemplateFormatVersion: "2010-09-09"
Description: IAM role and policies for StackWise (read-only discovery)

Parameters:
  TrustedPrincipalArn:
    Type: String
    Description: ARN of the IAM user or role that may assume StackWise. Use arn:aws:iam::ACCOUNT_ID:root for any identity in the account, or arn:aws:iam::ACCOUNT_ID:user/username for a specific user.

Resources:
  StackWiseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: stackwise
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
      Description: Role for StackWise read-only discovery (assumable via AWS profile)

  StackWiseReadOnlyPolicy:
    Type: AWS::IAM::Policy
    DependsOn: StackWiseRole
    Properties:
      PolicyName: stackwise-readonly
      Roles:
        - !Ref StackWiseRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StackWiseReadOnly
            Effect: Allow
            Action:
              - ec2:Describe*
              - autoscaling:Describe*
              - ecs:Describe*
              - ecs:List*
              - eks:Describe*
              - eks:List*
              - lambda:List*
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - rds:Describe*
              - dynamodb:Describe*
              - dynamodb:List*
              - s3:GetBucketLocation
              - s3:GetBucketVersioning
              - s3:GetBucketEncryption
              - s3:GetBucketPublicAccessBlock
              - s3:GetBucketLogging
              - s3:GetLifecycleConfiguration
              - s3:ListAllMyBuckets
              - elasticfilesystem:Describe*
              - elasticache:Describe*
              - elasticloadbalancing:Describe*
              - apigateway:GET
              - iam:List*
              - iam:Get*
              - kms:List*
              - kms:Describe*
              - kms:GetKeyRotationStatus
              - kms:GetKeyPolicy
              - secretsmanager:ListSecrets
              - secretsmanager:DescribeSecret
              - config:Describe*
              - config:Get*
              - securityhub:GetFindings
              - securityhub:List*
              - guardduty:List*
              - guardduty:Get*
              - cloudwatch:DescribeAlarms
              - logs:DescribeLogGroups
              - ce:GetCostAndUsage
              - ce:GetCostForecast
              - compute-optimizer:GetEc2InstanceRecommendations
              - compute-optimizer:GetLambdaFunctionRecommendations
              - tag:GetResources
              - sts:GetCallerIdentity
            Resource: "*"

Outputs:
  StackWiseRoleArn:
    Description: ARN of the StackWise IAM role
    Value: !GetAtt StackWiseRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-StackWiseRoleArn"
  StackWiseRoleName:
    Description: Name of the StackWise IAM role
    Value: !Ref StackWiseRole
    Export:
      Name: !Sub "${AWS::StackName}-StackWiseRoleName"
